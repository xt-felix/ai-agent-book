name: Deploy Book to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "output/ai-agent-book/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: output/ai-agent-book
        run: bun install
      - name: Build
        working-directory: output/ai-agent-book
        run: bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/ai-agent-book/docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
